name: Set up
description: Install Node and dependencies, and optionally the Playwright browser

inputs:
  playwright:
    description: Install the Playwright Chromium browser
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
    - if: inputs.playwright == 'true'
      id: playwright
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.playwright == 'true'
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
      shell: bash
